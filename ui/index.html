<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MailTrace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --paper:#f3eee4; --ink:#1c1814; --muted:#6b6358; --rule:#c9bfb0; --rust:#b33a2a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "IBM Plex Sans", sans-serif; background: #d9d1c3; color: var(--ink); min-height: 100vh; padding: 24px 16px 40px; }
    .sheet { max-width: 1080px; margin: 0 auto; background: var(--paper); border: 1px solid #b9ae9c; box-shadow: 0 18px 40px rgba(40,30,16,.18); padding: 28px 36px 24px; }
    .brand { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .28em; text-transform: uppercase; }
    .mast { display: flex; justify-content: space-between; border-bottom: 1px solid var(--ink); padding-bottom: 10px; margin-bottom: 18px; }
    .meta { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--muted); text-align: right; line-height: 1.5; }
    h1 { font-family: "Fraunces", serif; font-weight: 500; font-size: 32px; line-height: 1.15; letter-spacing: -.02em; }
    .drop { margin: 20px 0; border: 1px dashed #8a7f6e; padding: 28px; text-align: center; }
    .samples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    button, .chip { font-family: "IBM Plex Mono", monospace; font-size: 11px; background: transparent; border: 1px solid var(--ink); padding: 6px 10px; cursor: pointer; color: var(--ink); }
    button:hover { background: #e8e0d2; }
    .title-row { display: grid; grid-template-columns: 1fr 148px; gap: 20px; margin: 12px 0 18px; }
    .stamp { width: 148px; height: 148px; border: 3px solid var(--rust); color: var(--rust); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(-11deg); font-family: "IBM Plex Mono", monospace; }
    .stamp b { font-size: 42px; line-height: 1; font-weight: 500; }
    .stamp span { font-size: 13px; margin-top: 4px; letter-spacing: .08em; }
    .facts { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin-bottom: 18px; }
    .fact { padding: 10px 16px 10px 0; }
    .fact + .fact { border-left: 1px solid var(--rule); padding-left: 16px; }
    .k { font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .v { font-size: 14px; }
    .v.bad { color: var(--rust); }
    .grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: 28px; }
    h2 { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 12px 0 8px; }
    .reason { font-size: 15px; line-height: 1.45; padding: 8px 0; border-bottom: 1px solid var(--rule); }
    .hop { display: grid; grid-template-columns: 18px 1fr; gap: 8px; margin-bottom: 9px; font-size: 13px; }
    .dot { width: 9px; height: 9px; border: 1px solid var(--ink); border-radius: 50%; margin-top: 5px; }
    .dot.origin { background: var(--rust); border-color: var(--rust); }
    .who { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
    .ip { color: var(--muted); font-size: 12px; }
    #map { height: 200px; border: 1px solid var(--rule); background: #efe6d6; }
    #net { height: 200px; border: 1px solid var(--rule); background: #f7f1e6; }
    .foot { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--ink); padding-top: 10px; margin-top: 18px; font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--muted); word-break: break-all; }
    .hidden { display: none; }
    .sub { margin-top: 8px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); }
    .actions { margin-top: 12px; display: flex; gap: 8px; }
  </style>
</head>
<body>
  <article class="sheet">
    <header class="mast">
      <div class="brand">MailTrace</div>
      <div class="meta">SIH26106 · analyst lab<br />localhost · no Gmail ingest</div>
    </header>
    <section id="intake">
      <h1>Drop a saved email. Get a case file.</h1>
      <p class="sub">.eml upload or a demo sample. Origin = hosting city, not a person.</p>
      <div class="drop">
        <div>Upload .eml</div>
        <input id="file" type="file" accept=".eml,.txt,message/rfc822" />
        <div class="samples" id="samples"></div>
      </div>
    </section>
    <section id="case" class="hidden"></section>
  </article>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let map, net;
    async function loadSamples() {
      const rows = await (await fetch("/api/samples")).json();
      $("samples").innerHTML = rows.map((s) => `<button class="chip" data-name="${s.name}">${s.name}</button>`).join("");
      $("samples").onclick = (e) => { if (e.target.dataset.name) runSample(e.target.dataset.name); };
    }
    async function runSample(name) {
      render(await (await fetch("/api/analyze-sample/" + encodeURIComponent(name), { method: "POST" })).json());
    }
    $("file").onchange = async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      const fd = new FormData();
      fd.append("file", f, f.name);
      render(await (await fetch("/api/analyze", { method: "POST", body: fd })).json());
    };
    function esc(s) {
      return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }
    function render(d) {
      const p = d.parsed, f = d.fusion, o = p.origin || {};
      const originIp = o.ip;
      const hops = (p.hops || []).map((h) => {
        const isO = originIp && h.ip === originIp;
        return `<div class="hop"><div class="dot ${isO ? "origin" : ""}"></div><div><div class="who">${esc(h.raw || "")}</div><div class="ip">${esc(h.ip || "no ip")} · ${esc(h.city || "")} · ${esc(h.isp || "")}</div></div></div>`;
      }).join("");
      const reasons = (f.reasons || []).map((x, i) => `<p class="reason">${i + 1}. ${esc(x)}</p>`).join("");
      const intel = (p.intel || []).map((x) => `${x.domain}: ${x.age_days ?? "?"}d ${x.young ? "(young)" : ""}`).join(" · ");
      $("case").classList.remove("hidden");
      $("case").innerHTML = `
        <div class="title-row">
          <div>
            <h1>${esc(f.label)} · ${esc(p.filename)}</h1>
            <p class="sub">id ${esc(d.id)} · SPF ${esc(p.auth.spf)} · DKIM ${esc(p.auth.dkim)} · DMARC ${esc(p.auth.dmarc)}</p>
          </div>
          <div class="stamp"><b>${f.score}</b><span>${esc(f.label)}</span></div>
        </div>
        <div class="facts">
          <div class="fact"><div class="k">Claims to be</div><div class="v">${esc(p.from_display)} &lt;${esc(p.from_addr)}&gt;</div></div>
          <div class="fact"><div class="k">Reply-To</div><div class="v ${p.reply_mismatch ? "bad" : ""}">${esc(p.reply_to || "—")}${p.reply_mismatch ? "  ≠  From" : ""}</div></div>
        </div>
        <div class="grid">
          <section>
            <h2>Reasons</h2>${reasons}
            <h2>Offline domain cache</h2>
            <p class="reason">${esc(intel || "none")}</p>
            <div class="actions"><a href="/api/case/${d.id}/pdf" target="_blank"><button type="button">Download case PDF</button></a></div>
          </section>
          <section>
            <h2>Received chain</h2>
            ${hops || "<p class='reason'>No Received hops.</p>"}
            <h2>Origin map</h2>
            <div id="map"></div>
            <h2>Campaign graph</h2>
            <div id="net"></div>
          </section>
        </div>
        <footer class="foot">
          <div>SHA-256 ${esc(p.sha256)}</div>
          <div>${esc(f.origin_note)}</div>
        </footer>`;
      requestAnimationFrame(() => {
        drawMap(o);
        drawNet(d.graph || { nodes: [], edges: [] }, d.id);
      });
      $("case").scrollIntoView({ behavior: "smooth", block: "start" });
    }
    function drawMap(o) {
      const el = $("map");
      if (!el || !window.L) return;
      if (map) { map.remove(); map = null; }
      const lat = o.lat, lon = o.lon;
      map = L.map(el, { zoomControl: false, attributionControl: false });
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18 }).addTo(map);
      if (lat != null && lon != null) {
        map.setView([lat, lon], 5);
        L.circleMarker([lat, lon], { radius: 8, color: "#b33a2a", fillColor: "#b33a2a", fillOpacity: 1 })
          .addTo(map)
          .bindPopup((o.city || "") + " · " + (o.isp || "") + " — hosting, not GPS");
      } else {
        map.setView([20, 0], 2);
      }
      setTimeout(() => map.invalidateSize(), 200);
    }
    function drawNet(g, current) {
      const el = $("net");
      if (!el || !window.vis) return;
      const nodes = new vis.DataSet((g.nodes || []).map((n) => ({
        id: n.id,
        label: n.label || n.id,
        color: n.id === current ? "#b33a2a" : "#e8e0d2",
        font: { face: "IBM Plex Mono", size: 11 },
      })));
      const edges = new vis.DataSet((g.edges || []).map((e) => ({
        from: e.from, to: e.to, label: (e.shared || [])[0] || "",
        font: { size: 9 },
      })));
      net = new vis.Network(el, { nodes, edges }, {
        physics: false,
        edges: { color: "#6b6358", arrows: "to" },
        layout: { randomSeed: 2 },
      });
    }
    loadSamples();
  </script>
</body>
</html>
